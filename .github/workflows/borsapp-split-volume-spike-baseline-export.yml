name: Split Volume Spike baseline audit export

on:
  workflow_dispatch:
  push:
    branches:
      - research/borsapp-scanner-audit
    paths:
      - '.github/workflows/borsapp-split-volume-spike-baseline-export.yml'

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_ARTIFACT_ID: 10629956130
    steps:
      - name: Download and split baseline package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package split
          gh api -H 'Accept: application/vnd.github+json' "repos/${REPO}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > package.zip
          unzip -q package.zip -d package
          for tf in 15m 30m 45m 1H 2H 4H 1D 1W; do
            mkdir -p "split/${tf}"
            found=$(find package -type f -name "*.zip" | grep -E "-${tf}-|_${tf}_" | head -n 1 || true)
            if [ -z "$found" ]; then
              echo "No nested ZIP found for ${tf}" >&2
              find package -maxdepth 2 -type f -printf '%p\n' >&2
              exit 1
            fi
            cp "$found" "split/${tf}/16_VOLUME_SPIKE_BASELINE_${tf}.zip"
          done
      - name: Upload 15m
        uses: actions/upload-artifact@v4
        with:
          name: volume-spike-baseline-15m-split-${{ github.run_id }}
          path: split/15m/
          retention-days: 30
      - name: Upload 30m
        uses: actions/upload-artifact@v4
        with:
          name: volume-spike-baseline-30m-split-${{ github.run_id }}
          path: split/30m/
          retention-days: 30
      - name: Upload 45m
        uses: actions/upload-artifact@v4
        with:
          name: volume-spike-baseline-45m-split-${{ github.run_id }}
          path: split/45m/
          retention-days: 30
      - name: Upload 1H
        uses: actions/upload-artifact@v4
        with:
          name: volume-spike-baseline-1H-split-${{ github.run_id }}
          path: split/1H/
          retention-days: 30
      - name: Upload 2H
        uses: actions/upload-artifact@v4
        with:
          name: volume-spike-baseline-2H-split-${{ github.run_id }}
          path: split/2H/
          retention-days: 30
      - name: Upload 4H
        uses: actions/upload-artifact@v4
        with:
          name: volume-spike-baseline-4H-split-${{ github.run_id }}
          path: split/4H/
          retention-days: 30
      - name: Upload 1D
        uses: actions/upload-artifact@v4
        with:
          name: volume-spike-baseline-1D-split-${{ github.run_id }}
          path: split/1D/
          retention-days: 30
      - name: Upload 1W
        uses: actions/upload-artifact@v4
        with:
          name: volume-spike-baseline-1W-split-${{ github.run_id }}
          path: split/1W/
          retention-days: 30
