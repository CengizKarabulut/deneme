name: Exact technical scanner audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/borsapp-scanner-audit
    paths:
      - '.github/workflows/borsapp-exact-technicals-audit.yml'
      - 'experiments/borsapp_scanner_audit/exact_technical_replay.py'
      - 'experiments/borsapp_scanner_audit/exact_replay_common.py'

permissions:
  actions: read
  contents: read

concurrency:
  group: borsapp-exact-technicals-audit
  cancel-in-progress: true

jobs:
  exact-technical:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        scanner:
          - technical.failed_breakout
          - technical.decision_zone
          - technical.trend_continuation
          - technical.exhaustion
        period: [15m, 30m, 45m, 1H, 2H, 4H, 1D, 1W]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_REPOSITORY: CengizKarabulut/taramabot
      PERIOD: ${{ matrix.period }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2,<3' 'numpy>=1.26,<3'

      - name: Tarihsel SQLite artifactini indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical /tmp/history
          name="historical-live-${PERIOD}"
          artifact_id="$(gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id"
          gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/history.zip
          rm -rf /tmp/history/*
          unzip -q -o /tmp/history.zip -d /tmp/history
          DB="$(find /tmp/history -type f \( -name '*.sqlite' -o -name '*.db' -o -name '*.sqlite3' \) | head -n1 || true)"
          test -n "$DB"
          cp "$DB" historical/historical.sqlite
          echo "DB_PATH=$PWD/historical/historical.sqlite" >> "$GITHUB_ENV"

      - name: Exact replay kodunu derle
        run: |
          python -m py_compile experiments/borsapp_scanner_audit/exact_replay_common.py
          python -m py_compile experiments/borsapp_scanner_audit/exact_technical_replay.py

      - name: Exact technical auditini calistir
        env:
          SCANNER: ${{ matrix.scanner }}
        run: |
          set -euo pipefail
          SAFE=$(echo "$SCANNER" | tr '.' '_')
          OUT="exact_technical_results/${SAFE}/${PERIOD}"
          python experiments/borsapp_scanner_audit/exact_technical_replay.py \
            --db "$DB_PATH" \
            --scanner "$SCANNER" \
            --period "$PERIOD" \
            --out-dir "$OUT"

      - name: Exact technical sonucu artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: borsapp-exact-${{ matrix.scanner }}-${{ matrix.period }}-${{ github.run_id }}
          path: exact_technical_results/
          if-no-files-found: error
          retention-days: 30
