name: Scan13 1D Tight Plateau
run-name: "Scan13 · 1D tight plateau · ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scan13-1d-tight-bootstrap"

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: experiments/macd_yeniden_hareket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"
      - name: Gecmis veri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/history
          name="historical-live-1D"
          id="$(gh api "repos/CengizKarabulut/taramabot/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|last|.id // empty')"
          test -n "$id"
          gh api "repos/CengizKarabulut/taramabot/actions/artifacts/${id}/zip" > /tmp/history.zip
          unzip -q -o /tmp/history.zip -d /tmp/history
          db="$(find /tmp/history -type f -name '*.sqlite' | head -n1)"
          test -n "$db"
          cp "$db" data/historical_1D.sqlite
      - name: Tight plateau
        run: |
          mkdir -p reports/tight_plateau
          python scan13_1d_tight_plateau.py --db data/historical_1D.sqlite --output reports/tight_plateau/1D.json
      - uses: actions/upload-artifact@v4
        with:
          name: scan13-1d-tight-${{ github.run_id }}
          path: experiments/macd_yeniden_hareket/reports/tight_plateau/1D.json
          retention-days: 30
