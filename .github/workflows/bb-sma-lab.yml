name: BB SMA Lab
run-name: "BB/SMA · all TF · ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/bb-sma-bootstrap"

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        period: ["15m", "30m", "45m", "1H", "2H", "4H", "1D", "1W", "1M"]
    defaults:
      run:
        working-directory: experiments/bb_sma
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"
      - name: Kaynak gecmis-veri artifactini indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERIOD: ${{ matrix.period }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/history
          name="historical-live-${PERIOD}"
          id="$(gh api "repos/CengizKarabulut/taramabot/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|last|.id // empty')"
          test -n "$id"
          gh api "repos/CengizKarabulut/taramabot/actions/artifacts/${id}/zip" > /tmp/history.zip
          unzip -q -o /tmp/history.zip -d /tmp/history
          db="$(find /tmp/history -type f -name '*.sqlite' | head -n1)"
          test -n "$db"
          cp "$db" "data/historical_${PERIOD}.sqlite"
      - name: Kodu derle
        run: python -m py_compile bb_sma_wf.py
      - name: Walk-forward testi
        run: |
          mkdir -p reports/walk-forward
          python bb_sma_wf.py \
            --db "data/historical_${{ matrix.period }}.sqlite" \
            --period "${{ matrix.period }}" \
            --output "reports/walk-forward/${{ matrix.period }}.json"
      - name: Sonucu artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: bb-sma-${{ matrix.period }}-${{ github.run_id }}
          path: experiments/bb_sma/reports/walk-forward/${{ matrix.period }}.json
          retention-days: 30
