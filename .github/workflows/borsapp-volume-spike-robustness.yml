name: Borsapp Volume Spike Robustness
run-name: "Volume spike robustness · ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    branches:
      - research/borsapp-scanner-audit
    paths:
      - ".github/workflows/borsapp-volume-spike-robustness.yml"
      - "experiments/borsapp_scanner_audit/technical_volume_spike/volume_spike_robustness.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: borsapp-volume-spike-robustness
  cancel-in-progress: false

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        period: ["15m", "30m", "45m", "1H", "2H", "4H", "1D", "1W"]

    env:
      SOURCE_REPOSITORY: CengizKarabulut/taramabot
      PERIOD: ${{ matrix.period }}

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"

      - name: Tarihsel SQLite artifactini indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "experiments/borsapp_scanner_audit/data/${PERIOD}" /tmp/history
          name="historical-live-${PERIOD}"
          artifact_id="$(
            gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" |
              jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
          )"
          if [ -z "${artifact_id}" ]; then
            echo "::error::${SOURCE_REPOSITORY} icinde ${name} artifacti bulunamadi."
            exit 2
          fi
          gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/history.zip
          rm -rf /tmp/history/*
          unzip -q -o /tmp/history.zip -d /tmp/history
          sqlite_path="$(find /tmp/history -type f -name '*.sqlite' | head -n1 || true)"
          if [ -z "${sqlite_path}" ]; then
            echo "::error::Artifact icinde SQLite dosyasi yok."
            exit 3
          fi
          cp "${sqlite_path}" "experiments/borsapp_scanner_audit/data/${PERIOD}/historical.sqlite"

      - name: Robustness kodunu derle
        run: python -m py_compile experiments/borsapp_scanner_audit/technical_volume_spike/volume_spike_robustness.py

      - name: Robustness testini calistir
        run: |
          set -euo pipefail
          out="experiments/borsapp_scanner_audit/results/technical_volume_spike_robustness/${PERIOD}"
          mkdir -p "${out}"
          python experiments/borsapp_scanner_audit/technical_volume_spike/volume_spike_robustness.py \
            --db "experiments/borsapp_scanner_audit/data/${PERIOD}/historical.sqlite" \
            --period "${PERIOD}" \
            --out "${out}"

      - name: Sonuclari artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: borsapp-volume-spike-robustness-${{ matrix.period }}-${{ github.run_id }}
          path: experiments/borsapp_scanner_audit/results/technical_volume_spike_robustness/${{ matrix.period }}/
          if-no-files-found: error
          retention-days: 30
