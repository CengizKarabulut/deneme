name: Remaining scanner batch audit

permissions:
  actions: read
  contents: read

concurrency:
  group: borsapp-remaining-scanners-batch
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        scanner:
          - technical.failed_breakout
          - technical.decision_zone
          - technical.trend_continuation
          - technical.exhaustion
          - signal.macd_positive_cross
          - signal.rsi_momentum_volume
          - signal.rsi_macd_volume
          - signal.smi_macd_positive
          - signal.smi_macd_positive_volume_confirmed
          - signal.smi_macd_early
          - signal.smi_macd_full
          - signal.sma_macd_volume
          - signal.ema_trend_volume
          - ma.near_zone
          - decision.panel_v645
        period: [15m, 30m, 45m, 1H, 2H, 4H, 1D, 1W]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_REPOSITORY: CengizKarabulut/taramabot
      PERIOD: ${{ matrix.period }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"

      - name: Tarihsel SQLite artifactini indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p historical /tmp/history
          name="historical-live-${PERIOD}"
          artifact_id="$(gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "${artifact_id}" ]; then
            echo "Artifact bulunamadi: ${name}"
            exit 2
          fi
          gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/history.zip
          rm -rf /tmp/history/*
          unzip -q -o /tmp/history.zip -d /tmp/history
          DB="$(find /tmp/history -type f \( -name '*.sqlite' -o -name '*.db' -o -name '*.sqlite3' \) | head -n 1 || true)"
          if [ -z "${DB}" ]; then
            echo "SQLite dosyasi bulunamadi: ${name}"
            exit 3
          fi
          cp "${DB}" historical/historical.sqlite
          echo "DB_PATH=$PWD/historical/historical.sqlite" >> "$GITHUB_ENV"

      - name: Audit kodunu derle
        run: python -m py_compile experiments/borsapp_scanner_audit/batch_remaining/remaining_scanners_batch.py

      - name: Scanner auditini calistir
        env:
          SCANNER: ${{ matrix.scanner }}
        run: |
          set -euo pipefail
          SAFE=$(echo "$SCANNER" | tr '.' '_')
          OUT="results/${SAFE}/${PERIOD}"
          python experiments/borsapp_scanner_audit/batch_remaining/remaining_scanners_batch.py \
            --db "$DB_PATH" \
            --scanner "$SCANNER" \
            --period "$PERIOD" \
            --out-dir "$OUT"

      - name: Sonuclari artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: borsapp-${{ matrix.scanner }}-${{ matrix.period }}-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 30
