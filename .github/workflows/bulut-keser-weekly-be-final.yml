name: BulutKeser Weekly BE Final
run-name: "BulutKeser · weekly BE final · ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/bulut-keser-weekly-be-final-bootstrap"

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: experiments/bulut_keser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"
      - name: Gecmis veri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/history
          name="historical-live-1W"
          id="$(gh api "repos/CengizKarabulut/taramabot/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|last|.id // empty')"
          test -n "$id"
          gh api "repos/CengizKarabulut/taramabot/actions/artifacts/${id}/zip" > /tmp/history.zip
          rm -rf /tmp/history/*
          unzip -q -o /tmp/history.zip -d /tmp/history
          db="$(find /tmp/history -type f -name '*.sqlite' | head -n1)"
          test -n "$db"
          cp "$db" data/historical_1W.sqlite
      - name: Weekly BE final
        run: |
          mkdir -p reports/final
          python bulut_keser_weekly_be_final.py \
            --db data/historical_1W.sqlite \
            --output reports/final/1W-be.json
      - uses: actions/upload-artifact@v4
        with:
          name: bulut-keser-weekly-be-final-${{ github.run_id }}
          path: experiments/bulut_keser/reports/final/1W-be.json
          retention-days: 30
