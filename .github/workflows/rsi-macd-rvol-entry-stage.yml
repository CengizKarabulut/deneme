name: RSI MACD RVOL Entry Stage
run-name: "RSI/MACD/RVOL · entry stage · ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/rsi-macd-rvol-entry-bootstrap"

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        period: ["15m", "30m", "45m", "1H", "2H", "4H", "1D", "1W", "1M"]
    defaults:
      run:
        working-directory: experiments/rsi_macd_rvol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"
      - name: Gecmis veri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERIOD: ${{ matrix.period }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/history
          name="historical-live-${PERIOD}"
          id="$(gh api "repos/CengizKarabulut/taramabot/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|last|.id // empty')"
          test -n "$id"
          gh api "repos/CengizKarabulut/taramabot/actions/artifacts/${id}/zip" > /tmp/history.zip
          unzip -q -o /tmp/history.zip -d /tmp/history
          db="$(find /tmp/history -type f -name '*.sqlite' | head -n1)"
          test -n "$db"
          cp "$db" "data/historical_${PERIOD}.sqlite"
      - name: Entry robustness
        run: |
          mkdir -p reports/entry-stage
          python rsi_macd_rvol_entry_stage.py \
            --db "data/historical_${{ matrix.period }}.sqlite" \
            --period "${{ matrix.period }}" \
            --output "reports/entry-stage/${{ matrix.period }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rsi-macd-rvol-entry-${{ matrix.period }}-${{ github.run_id }}
          path: experiments/rsi_macd_rvol/reports/entry-stage/${{ matrix.period }}.json
          retention-days: 30
