name: NE ARARSAN VAR 4H Final Compare
run-name: "NE ARARSAN VAR · 4H final compare · ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/ne-ararsan-var-4h-final-bootstrap"

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"

      - name: 4H gecmis-veri artifactini indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOSITORY: CengizKarabulut/taramabot
        run: |
          set -euo pipefail
          mkdir -p experiments/ne_ararsan_var/data/history /tmp/history
          name="historical-live-4H"
          artifact_id="$(
            gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" |
              jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
          )"
          if [ -z "${artifact_id}" ]; then
            echo "::error::${name} artifact bulunamadi."
            exit 2
          fi
          gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/history.zip
          unzip -q -o /tmp/history.zip -d /tmp/history
          sqlite_path="$(find /tmp/history -type f -name '*.sqlite' | head -n1 || true)"
          test -n "${sqlite_path}"
          cp "${sqlite_path}" experiments/ne_ararsan_var/data/history/historical_4H.sqlite

      - name: Kodu derle
        working-directory: experiments/ne_ararsan_var
        run: |
          python -m py_compile \
            market_data_store.py \
            ne_ararsan_var_research.py \
            ne_ararsan_var_histogram_wf.py \
            ne_ararsan_var_4h_final_compare.py

      - name: 4H sabit-kural karsilastirmasi
        working-directory: experiments/ne_ararsan_var
        run: |
          mkdir -p results/4h_final
          python ne_ararsan_var_4h_final_compare.py \
            --db data/history/historical_4H.sqlite \
            --output results/4h_final/4H.json

      - name: Sonucu artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: ne-ararsan-var-4h-final-${{ github.run_id }}
          path: experiments/ne_ararsan_var/results/4h_final/4H.json
          if-no-files-found: error
          retention-days: 30
