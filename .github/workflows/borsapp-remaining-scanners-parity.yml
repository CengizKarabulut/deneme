name: Remaining scanner production parity

on:
  workflow_dispatch:
  push:
    branches:
      - research/borsapp-scanner-audit
    paths:
      - '.github/workflows/borsapp-remaining-scanners-parity.yml'
      - 'experiments/borsapp_scanner_audit/batch_remaining/exact_parity_sample.py'

permissions:
  actions: read
  contents: read

concurrency:
  group: borsapp-remaining-scanners-parity
  cancel-in-progress: true

jobs:
  parity:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        scanner:
          - technical.failed_breakout
          - technical.decision_zone
          - technical.trend_continuation
          - technical.exhaustion
          - signal.macd_positive_cross
          - signal.rsi_momentum_volume
          - signal.rsi_macd_volume
          - signal.smi_macd_positive
          - signal.smi_macd_positive_volume_confirmed
          - signal.smi_macd_early
          - signal.smi_macd_full
          - signal.sma_macd_volume
          - signal.ema_trend_volume
          - decision.panel_v645
        period: [15m, 30m, 45m, 1H, 2H, 4H, 1D, 1W]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_REPOSITORY: CengizKarabulut/taramabot
      PERIOD: ${{ matrix.period }}
    steps:
      - name: Audit reposunu al
        uses: actions/checkout@v4

      - name: Production borsapp kaynagini salt okunur al
        uses: actions/checkout@v4
        with:
          repository: CengizKarabulut/borsapp
          ref: main
          path: borsapp-production

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2,<3' 'numpy>=1.26,<3'
          pip install -e ./borsapp-production

      - name: Tarihsel SQLite artifactini indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical /tmp/history
          name="historical-live-${PERIOD}"
          artifact_id="$(gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "${artifact_id}" ]; then
            echo "Artifact bulunamadi: ${name}"
            exit 2
          fi
          gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/history.zip
          rm -rf /tmp/history/*
          unzip -q -o /tmp/history.zip -d /tmp/history
          DB="$(find /tmp/history -type f \( -name '*.sqlite' -o -name '*.db' -o -name '*.sqlite3' \) | head -n 1 || true)"
          if [ -z "${DB}" ]; then
            echo "SQLite dosyasi bulunamadi: ${name}"
            exit 3
          fi
          cp "${DB}" historical/historical.sqlite
          echo "DB_PATH=$PWD/historical/historical.sqlite" >> "$GITHUB_ENV"

      - name: Parity kodunu derle
        run: python -m py_compile experiments/borsapp_scanner_audit/batch_remaining/exact_parity_sample.py

      - name: Production parity orneklemesini calistir
        env:
          SCANNER: ${{ matrix.scanner }}
          PERIOD: ${{ matrix.period }}
        run: |
          set -euo pipefail
          SAFE=$(echo "$SCANNER" | tr '.' '_')
          OUT="parity_results/${SAFE}/${PERIOD}"
          python experiments/borsapp_scanner_audit/batch_remaining/exact_parity_sample.py \
            --db "$DB_PATH" \
            --scanner "$SCANNER" \
            --period "$PERIOD" \
            --borsapp-root borsapp-production \
            --audit-root experiments/borsapp_scanner_audit/batch_remaining \
            --out "$OUT"

      - name: Parity sonucunu artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: borsapp-parity-${{ matrix.scanner }}-${{ matrix.period }}-${{ github.run_id }}
          path: parity_results/
          if-no-files-found: error
          retention-days: 30
