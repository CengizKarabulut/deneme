name: NE ARARSAN VAR Lab
run-name: "NE ARARSAN VAR lab · ${{ inputs.experiment || 'robustness' }} · ${{ inputs.period || 'all' }} · ${{ github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Araştırma türü"
        required: true
        default: robustness
        type: choice
        options:
          - robustness
          - histogram
          - baseline
          - exit_optimize
          - tf_exit
      period:
        description: "Zaman dilimi"
        required: true
        default: all
        type: choice
        options:
          - all
          - 15m
          - 30m
          - 45m
          - 1H
          - 2H
          - 4H
          - 1D
          - 1W
          - 1M
  push:
    paths:
      - ".github/ne-ararsan-var-lab-bootstrap"

permissions:
  actions: read
  contents: read

concurrency:
  group: ne-ararsan-var-lab-${{ inputs.experiment || 'robustness' }}-${{ inputs.period || 'all' }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        period: ["15m", "30m", "45m", "1H", "2H", "4H", "1D", "1W", "1M"]

    env:
      EXPERIMENT: ${{ inputs.experiment || 'robustness' }}
      REQUESTED_PERIOD: ${{ inputs.period || 'all' }}
      SOURCE_REPOSITORY: CengizKarabulut/taramabot

    steps:
      - name: Bu matrix işi çalışmalı mı?
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          run=false
          if [ "${REQUESTED_PERIOD}" = "all" ] || [ "${REQUESTED_PERIOD}" = "${{ matrix.period }}" ]; then
            run=true
          fi
          if [ "${EXPERIMENT}" = "tf_exit" ]; then
            case "${{ matrix.period }}" in
              15m|30m|45m|1H|2H) ;;
              *) run=false ;;
            esac
          fi
          if [ "${EXPERIMENT}" = "robustness" ]; then
            case "${{ matrix.period }}" in
              1D|1W) ;;
              *) run=false ;;
            esac
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "experiment=${EXPERIMENT}; requested=${REQUESTED_PERIOD}; matrix=${{ matrix.period }}; run=${run}"

      - name: Kodu al
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Araştırma bağımlılıklarını kur
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"

      - name: Kaynak geçmiş-veri artifactını indir
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERIOD: ${{ matrix.period }}
        run: |
          set -euo pipefail
          mkdir -p experiments/ne_ararsan_var/data/history /tmp/history
          name="historical-live-${PERIOD}"

          artifact_id="$(
            gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" |
              jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
          )"

          if [ -z "${artifact_id}" ]; then
            echo "::error::${SOURCE_REPOSITORY} içinde ${name} artifactı bulunamadı."
            exit 2
          fi

          echo "${PERIOD}: ${SOURCE_REPOSITORY} artifact ${artifact_id}"
          gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/history.zip
          unzip -q -o /tmp/history.zip -d /tmp/history
          sqlite_path="$(find /tmp/history -type f -name '*.sqlite' | head -n1 || true)"
          if [ -z "${sqlite_path}" ]; then
            echo "::error::Artifact içinde SQLite dosyası yok."
            exit 3
          fi
          cp "${sqlite_path}" "experiments/ne_ararsan_var/data/history/historical_${PERIOD}.sqlite"
          ls -lh "experiments/ne_ararsan_var/data/history/historical_${PERIOD}.sqlite"

      - name: Araştırma kodunu derle
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/ne_ararsan_var
        run: |
          python -m py_compile \
            market_data_store.py \
            ne_ararsan_var_research.py \
            ne_ararsan_var_optimize.py \
            ne_ararsan_var_tf_exit_research.py \
            ne_ararsan_var_histogram_wf.py \
            ne_ararsan_var_histogram_robustness.py

      - name: Araştırmayı çalıştır
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/ne_ararsan_var
        env:
          PERIOD: ${{ matrix.period }}
        run: |
          set -euo pipefail
          mkdir -p "results/${EXPERIMENT}"
          db="data/history/historical_${PERIOD}.sqlite"
          out="results/${EXPERIMENT}/${PERIOD}.json"

          case "${EXPERIMENT}" in
            robustness)
              python ne_ararsan_var_histogram_robustness.py --db "${db}" --period "${PERIOD}" --output "${out}"
              ;;
            histogram)
              python ne_ararsan_var_histogram_wf.py --db "${db}" --period "${PERIOD}" --output "${out}"
              ;;
            baseline)
              python ne_ararsan_var_research.py --db "${db}" --period "${PERIOD}" --output "${out}"
              ;;
            exit_optimize)
              python ne_ararsan_var_optimize.py --db "${db}" --period "${PERIOD}" --output "${out}"
              ;;
            tf_exit)
              python ne_ararsan_var_tf_exit_research.py --db "${db}" --period "${PERIOD}" --output "${out}"
              ;;
            *)
              echo "::error::Bilinmeyen experiment: ${EXPERIMENT}"
              exit 4
              ;;
          esac

      - name: Sonucu artifact olarak sakla
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ne-ararsan-var-lab-${{ env.EXPERIMENT }}-${{ matrix.period }}-${{ github.run_id }}
          path: experiments/ne_ararsan_var/results/${{ env.EXPERIMENT }}/${{ matrix.period }}.json
          if-no-files-found: error
          retention-days: 30
