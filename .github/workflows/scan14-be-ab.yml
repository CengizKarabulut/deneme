name: Scan14 MACD DipDonusu TP1 BE
run-name: "Scan14 MACD DipDonusu · TP1 BE · ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scan14-be-bootstrap"

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        period: ["4H","1D","1W","1M"]
    defaults:
      run:
        working-directory: experiments/macd_dip_donusu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"
      - name: Gecmis veri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERIOD: ${{ matrix.period }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/history
          name="historical-live-${PERIOD}"
          id="$(gh api "repos/CengizKarabulut/taramabot/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|last|.id // empty')"
          test -n "$id"
          gh api "repos/CengizKarabulut/taramabot/actions/artifacts/${id}/zip" > /tmp/history.zip
          rm -rf /tmp/history/*
          unzip -q -o /tmp/history.zip -d /tmp/history
          db="$(find /tmp/history -type f -name '*.sqlite' | head -n1)"
          test -n "$db"
          cp "$db" "data/historical_${PERIOD}.sqlite"
      - name: TP1 BE A B
        run: |
          mkdir -p reports/be
          python scan14_be_ab.py \
            --db "data/historical_${{ matrix.period }}.sqlite" \
            --period "${{ matrix.period }}" \
            --output "reports/be/${{ matrix.period }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: scan14-be-${{ matrix.period }}-${{ github.run_id }}
          path: experiments/macd_dip_donusu/reports/be/${{ matrix.period }}.json
          retention-days: 30
