name: MA near-zone causal OOS audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/borsapp-scanner-audit
    paths:
      - '.github/workflows/borsapp-ma-near-zone-causal-oos.yml'
      - 'experiments/borsapp_scanner_audit/ma_near_zone_causal_oos.py'
      - 'experiments/borsapp_scanner_audit/exact_replay_common.py'

permissions:
  actions: read
  contents: read

concurrency:
  group: borsapp-ma-near-zone-causal-oos
  cancel-in-progress: true

jobs:
  ma-oos:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        period: [15m, 30m, 45m, 1H, 2H, 4H, 1D, 1W]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SOURCE_REPOSITORY: CengizKarabulut/taramabot
      PERIOD: ${{ matrix.period }}
    steps:
      - name: Audit reposunu al
        uses: actions/checkout@v4

      - name: Production borsapp kaynagini salt okunur al
        uses: actions/checkout@v4
        with:
          repository: CengizKarabulut/borsapp
          ref: main
          path: borsapp-production

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2,<3' 'numpy>=1.26,<3'
          pip install -e ./borsapp-production

      - name: Tarihsel SQLite artifactini indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical /tmp/history
          name="historical-live-${PERIOD}"
          artifact_id="$(gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id"
          gh api "repos/${SOURCE_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/history.zip
          rm -rf /tmp/history/*
          unzip -q -o /tmp/history.zip -d /tmp/history
          DB="$(find /tmp/history -type f \( -name '*.sqlite' -o -name '*.db' -o -name '*.sqlite3' \) | head -n1 || true)"
          test -n "$DB"
          cp "$DB" historical/historical.sqlite
          echo "DB_PATH=$PWD/historical/historical.sqlite" >> "$GITHUB_ENV"

      - name: Causal MA auditini calistir
        run: |
          set -euo pipefail
          OUT="ma_oos_results/${PERIOD}"
          python experiments/borsapp_scanner_audit/ma_near_zone_causal_oos.py \
            --db "$DB_PATH" \
            --period "$PERIOD" \
            --out-dir "$OUT" \
            --qualification-fraction 0.60 \
            --research-bars 1000

      - name: MA OOS sonucunu artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: borsapp-ma-near-zone-causal-oos-${{ matrix.period }}-${{ github.run_id }}
          path: ma_oos_results/
          if-no-files-found: error
          retention-days: 30
